[rules]
default_action = "approve"  # approve | deny | ask — by default everything is auto-approved

# Substrings stripped from commands before keyword matching, so they
# don't false-positive (e.g. "--rm" in "docker run --rm" won't trigger "rm ")
safe_substrings = ["--rm", "truncate -s", "git rm"]

# No deny keywords
[rules.deny]
keywords = []

# These commands will prompt the user for confirmation
[rules.ask]
keywords = [
    "rm ",
    "mv ",
    "rmdir",
    "unlink ",
    "docker rm",
    "docker rmi",
    "docker system prune",
    "docker volume rm",
    "docker container rm",
    "push --force",
    "push -f",
    "push.*main",
    "push.*master",
    "git reset --hard",
    "git clean",
    "git checkout .",
    "git restore .",
    "--no-verify",
    "drop ",
    "truncate ",
    "DELETE FROM",
    "killall ",
    "shutdown",
    "reboot",
    "brew uninstall",
    "brew remove",
    "pip uninstall",
    "npm uninstall",
]

# Scoped rules: auto-approve dangerous commands IF all file path arguments
# resolve within the project directory (git root of cwd). Falls through to
# normal ask behavior when paths can't be verified or escape the boundary.
[rules.scoped]
keywords = ["rm ", "mv ", "rmdir", "unlink "]
allow_project_dir = true   # auto-detect git root from cwd
allowed_dirs = ["/tmp"]     # additional absolute paths where scoped commands are auto-approved

# Docker scoped rules: auto-approve docker rm/rmi when targeting specific
# containers/images by name (literal arguments only). Falls through to ask
# when shell expansion ($(...), $VAR, backticks) is detected — prevents
# one agent from nuking another agent's containers.
[rules.docker_scoped]
keywords = ["docker rm", "docker rmi", "docker container rm"]

# Context-aware kubectl/helm/helmfile scoped rules: auto-approve writes on
# non-production contexts, prompt for production writes. Read ops fall through
# to native permissions (which auto-approve them).
[rules.kubectl_scoped]
production_contexts = ["alicloud-production"]
kubectl_write_subcommands = [
    "apply", "create", "delete", "edit", "patch", "replace",
    "run", "scale", "autoscale", "rollout", "expose", "set",
    "cordon", "uncordon", "drain", "taint", "label", "annotate",
    "cp", "debug",
]
helm_write_subcommands = ["install", "upgrade", "uninstall", "rollback", "delete"]
helmfile_write_subcommands = ["apply", "sync", "destroy", "delete"]

# Allow keywords (not strictly needed since default is approve, but explicit)
[rules.allow]
keywords = []
